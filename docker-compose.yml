name: news-aggregator

services:
  backend:
    image: ghcr.io/neclor/news-aggregator/backend:latest
    container_name: news-aggregator-backend
    env_file: .env
    environment:
      DB_PATH: /app/data/news.db
      TG_BACKEND_SESSION_PATH: /app/sessions/backend_session
    ports:
      - "${SERVER_PORT:-8080}:8000"
    volumes:
      - news-aggregator-data:/app/data
      - ${HOST_SESSIONS_DIR:-./sessions}:/app/sessions
    restart: unless-stopped
    networks:
      - news-aggregator-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: ghcr.io/neclor/news-aggregator/bot:latest
    container_name: news-aggregator-bot
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      TG_BOT_SESSION_PATH: /app/sessions/bot_session
      BOT_DATA_PATH: /app/data/bot_data.json
    volumes:
      - news-aggregator-data:/app/data
      - ${HOST_SESSIONS_DIR:-./sessions}:/app/sessions
    restart: unless-stopped
    networks:
      - news-aggregator-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  news-aggregator-data:

networks:
  news-aggregator-network:
    driver: bridge
