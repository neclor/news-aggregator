services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: news-aggregator-backend
    env_file: configs/.env
    ports:
      - "5300:8000"
    volumes:
      - ./data:/app/data
      - ./configs/.env:/app/configs/.env:ro
    restart: unless-stopped
    networks:
      - aggregator-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: news-aggregator-bot
    env_file: configs/.env
    environment:
      - API_BASE=http://backend:8000
    volumes:
      - ./data:/app/data
      - ./configs/.env:/app/configs/.env:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aggregator-network

networks:
  aggregator-network:
    driver: bridge
