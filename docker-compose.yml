version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: news-aggregator-backend
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
    ports:
      - "5300:8000"
    volumes:
      - ./data:/app/data
      - ./configs/.env:/app/configs/.env:ro
    restart: unless-stopped
    networks:
      - aggregator-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: news-aggregator-bot
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - API_BASE=http://backend:8000
    volumes:
      - ./data:/app/data
      - ./configs/.env:/app/configs/.env:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aggregator-network

networks:
  aggregator-network:
    driver: bridge
