name: Deploy UI (Server)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy
        required: true

concurrency:
  group: site-deploy-server
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
          KEY: ${{ secrets.SSH_KEY }}

          WEB_DIR: ${{ vars.WEB_DIR }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}

        run: |
          echo "$KEY" > ssh_key
          chmod 600 ssh_key

          ssh -i ssh_key \
            -p $PORT \
            -o StrictHostKeyChecking=no \
            $USER@$HOST \
            "curl -fsSL https://github.com/${{ github.repository }}/releases/download/$TAG/news-aggregator-site.zip \
              -o /tmp/news-aggregator-site.zip \
              && mkdir -p $WEB_DIR \
              && unzip -o /tmp/news-aggregator-site.zip -d $WEB_DIR \
              && rm /tmp/news-aggregator-site.zip"

          rm ssh_key
