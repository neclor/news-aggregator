name: Build Site

on:
  push:
    branches: [main]
    paths: [src/site/**, .github/workflows/site-build.yml]
  pull_request:
    paths: [src/site/**, .github/workflows/site-build.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: src/site/package.json
          cache: npm
          cache-dependency-path: src/site/package-lock.json

      - name: Install dependencies
        working-directory: src/site
        run: npm ci

      - name: Build
        working-directory: src/site
        run: npm run build
